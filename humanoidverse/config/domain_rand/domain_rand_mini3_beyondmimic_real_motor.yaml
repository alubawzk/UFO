# @package _global_

# Domain randomization inherited by Mini3-BeyondMimic-RealMotor from
# Mini3BeyondMimicEnvCfg/Mini3EventCfg in mini3_lab.
domain_rand:
  profile: mini3_beyondmimic_real_motor

  # Interval push, sampled independently for every environment.
  push_robots: true
  randomize_push_robots: true
  push_interval_s: [1.0, 3.0]
  push_velocity_range:
    x: [-0.5, 0.5]
    y: [-0.5, 0.5]
    z: [-0.2, 0.2]
    roll: [-0.52, 0.52]
    pitch: [-0.52, 0.52]
    yaw: [-0.78, 0.78]
  max_push_vel_xy: 0.5
  max_push_ang_vel: 0.78
  push_robot_recovery_time: 2.0

  # Startup rigid-body randomization.
  randomize_rigid_body_material: true
  randomize_friction: true
  rigid_body_material:
    static_friction_range: [0.6, 1.6]
    dynamic_friction_range: [0.6, 1.2]
    restitution_range: [0.1, 0.5]
    num_buckets: 64
  # MuJoCo has one tangential Coulomb-friction field. The MJLab bridge maps
  # the target dynamic-friction buckets to that field.
  friction_range: [0.6, 1.2]

  randomize_base_mass: true
  base_mass_body_names: [waist_yaw_link]
  base_mass_range: [-1.5, 1.5]

  randomize_base_com: true
  base_com_body_names: [waist_yaw_link]
  base_com_range:
    x: [-0.03, 0.10]
    y: [-0.05, 0.05]
    z: [-0.08, 0.08]

  randomize_link_mass: true
  link_mass_body_names: ["left_.*_link", "right_.*_link"]
  link_mass_range: [0.8, 1.2]

  # Startup actuator and joint-parameter randomization. Ankle damping is
  # intentionally much wider than the non-ankle range.
  randomize_pd_gain: true
  pd_gain:
    non_ankle:
      kp_range: [0.8, 1.2]
      kd_range: [0.8, 1.2]
    ankle:
      kp_range: [0.8, 1.2]
      kd_range: [0.3, 5.0]
  kp_range: [0.8, 1.2]
  kd_range: [0.8, 1.2]

  randomize_joint_parameters: true
  joint_parameters:
    non_ankle:
      friction_range: [0.7, 1.3]
      armature_range: [0.7, 1.3]
    ankle:
      friction_range: [0.5, 2.0]
      armature_range: [0.5, 1.5]

  # Startup calibration offset used by both actor observations and action
  # targets, matching randomize_joint_default_pos(operation="add").
  randomize_default_dof_pos: true
  default_dof_pos_randomization_mode: startup
  default_dof_pos_noise_range: [-0.07, 0.07]

  # Motion-command reset perturbations.
  randomize_initial_state: true
  reset_state:
    pose_range:
      x: [-0.05, 0.05]
      y: [-0.05, 0.05]
      z: [0.0, 0.02]
      roll: [0.0, 0.0]
      pitch: [0.0, 0.0]
      yaw: [-0.2, 0.2]
    velocity_range:
      x: [-0.1, 0.1]
      y: [-0.1, 0.1]
      z: [-0.1, 0.1]
      roll: [-0.2, 0.2]
      pitch: [-0.2, 0.2]
      yaw: [-0.3, 0.3]
    joint_position_range: [-0.03, 0.03]
    reset_root_height_offset: 0.02
    soft_joint_pos_limit_factor: 0.90

  # RealMotor actuator delays are defined per actuator group in mini3.yaml.
  randomize_ctrl_delay: true
  ctrl_delay_step_range: [0, 0]

  # Mini3-BeyondMimic-RealMotor has no motor-strength/RFI event.
  randomize_motor_strength: false
  motor_strength_range: [1.0, 1.0]
  randomize_torque_rfi: false
  rfi_lim: 0.0
  randomize_rfi_lim: false
  rfi_lim_range: [1.0, 1.0]
